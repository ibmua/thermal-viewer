[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-viewer"
version = "1.0.0"
description = "Open-source thermal camera viewer — FLIR Boson, Lepton, InfiRay and other UVC cameras"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.7",
    "numpy>=1.24",
    "sounddevice>=0.5; platform_system == 'Darwin'",
    "pyobjc-core>=11.1,<12; platform_system == 'Darwin'",
    "pyobjc-framework-AVFoundation>=11.1,<12; platform_system == 'Darwin'",
    "pyobjc-framework-Cocoa>=11.1,<12; platform_system == 'Darwin'",
    "pyobjc-framework-CoreAudio>=11.1,<12; platform_system == 'Darwin'",
    "pyobjc-framework-CoreMedia>=11.1,<12; platform_system == 'Darwin'",
    "pyobjc-framework-Quartz>=11.1,<12; platform_system == 'Darwin'",
]

[project.urls]
Homepage = "https://github.com/ibmua/thermal-viewer"
Issues   = "https://github.com/ibmua/thermal-viewer/issues"

[project.scripts]
thermal-viewer = "thermal_viewer:main"

[tool.setuptools]
py-modules = ["thermal_viewer", "fps_bare"]
