[package]
name    = "thermal_core"
version = "0.1.0"
edition = "2021"

[lib]
name      = "thermal_core"
crate-type = ["cdylib"]

[dependencies]
pyo3     = { version = "0.21", features = ["extension-module"] }
numpy    = "0.21"
rayon    = "1.10"
bytemuck = "1.16"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
